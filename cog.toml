disable_changelog = true
ignore_merge_commits = true

# Bare semver stays in package.json; only the git tag is v-prefixed.
tag_prefix = "v"

# Bump commit required: release.yml skips "chore(version):" head commits.
disable_bump_commit = false

# Write the computed version into package.json as part of the bump commit.
pre_bump_hooks = [
  "npm version {{version}} --no-git-tag-version --allow-same-version",
]
